[project]
name = "ai-article-studio"
version = "0.1.0"
description = "A Python-first, multi-stage AI article and image creation studio."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "bleach>=6.2",
  "fastapi>=0.115",
  "httpx>=0.28",
  "jinja2>=3.1",
  "markdown>=3.7",
  "pymdown-extensions>=10.15",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_article_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ai_article_studio"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = false
